[project]
name = "dealbrain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["apps/portal/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]
