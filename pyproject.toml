[project]
name = "dealbrain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "rapidfuzz>=3.9",
    "usaddress>=0.5.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["apps/portal/"]

[[tool.mypy.overrides]]
module = ["usaddress"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]
